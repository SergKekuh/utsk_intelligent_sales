<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTSK — Рекомендации по продукту</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --text-main: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .placeholder {
            text-align: center;
            padding: 60px 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            max-width: 500px;
        }
        .placeholder h1 {
            font-size: 24px;
            margin-bottom: 12px;
        }
        .placeholder p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }
        .placeholder .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        .back-link:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>
    <div class="placeholder">
        <div class="icon">🚧</div>
        <h1>Страница в разработке</h1>
        <p>
            Здесь будет подробная аналитика по рекомендуемому продукту для клиента.<br>
            История покупок, динамика цен, сравнение с другими клиентами и прогноз спроса.
        </p>
        <a href="javascript:history.back()" class="back-link">← Вернуться назад</a>
    </div>
</body>
</html>
